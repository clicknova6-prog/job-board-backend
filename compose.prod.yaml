# Production stack for one VM (Oracle Cloud Free: 2 OCPU / 12 GB ARM).
#   docker compose -f compose.prod.yaml up -d --build
# All settings come from ./.env (create it with deploy/init-env.sh).
# Only Caddy is reachable from outside (80/443); everything else stays on
# the private compose network.

name: job-board

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build: .
  image: job-board-backend:latest
  env_file: .env
  restart: unless-stopped
  logging: *logging
  volumes:
    - app_storage:/app/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    # Tuned for ~12 GB RAM shared with the app containers.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=100
      - -c
      - wal_compression=on
      - -c
      - random_page_cost=1.1
    shm_size: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # Broker + cache: never evict (would drop queued tasks); snapshot to disk.
    command: ["redis-server", "--maxmemory", "768mb", "--maxmemory-policy", "noeviction", "--save", "300", "10"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true

  api:
    <<: *app
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --workers=${API_WORKERS:-2}
      - --proxy-headers
      # Only Caddy can reach this port (private network), so trust it.
      - --forwarded-allow-ips=*
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command:
      - celery
      - -A
      - app.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=${WORKER_CONCURRENCY:-2}
      - --max-tasks-per-child=20
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    <<: *app
    command:
      - celery
      - -A
      - app.celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/app/storage/beat/celerybeat-schedule
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      API_DOMAIN: ${API_DOMAIN:?set in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  app_storage:
  caddy_data:
  caddy_config:
